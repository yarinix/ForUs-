<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рисование</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            touch-action: none;
            flex: 1;
            width: 100%;
            display: block;
        }
        .toolbar {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            background: #1a1a1a;
            align-items: center;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .tool-btn {
            background: #2a2a2a;
            color: #aaa;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-weight: 500;
        }
        .tool-btn.active {
            background: #2ea6ff;
            color: #fff;
            border-color: #2ea6ff;
        }
        .colors {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-btn.active {
            border-color: #fff;
            transform: scale(1.2);
        }
        .bg-colors {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .bg-btn {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #555;
        }
        .actions {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: space-between;
        }
        button.action-btn {
            background: #2ea6ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        button.clear {
            background: #ff4757;
        }
        #preview {
            position: fixed; inset: 0; z-index: 10; display: none;
            flex-direction: column; background: #000; padding: 12px; box-sizing: border-box; gap: 10px;
        }
        #preview .note { text-align: center; font-size: 13px; color: #aaa; }
        #previewImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #333; }
        #preview .row button { flex: 1; }
    </style>
</head>
<body>
    <canvas id="paintCanvas"></canvas>
    
    <div class="toolbar">
        <!-- Ряд 1: Инструменты (Кисть, Ластик, Заливка) и выбор фона -->
        <div class="row">
            <button class="tool-btn active" id="btnPen" onclick="setTool('pen')">✏️ Кисть</button>
            <button class="tool-btn" id="btnEraser" onclick="setTool('eraser')">🧹 Ластик</button>
            <button class="tool-btn" id="btnFill" onclick="setTool('fill')">🪣 Заливка</button>
            <div class="bg-colors" title="Цвет фона">
                <div class="bg-btn" style="background: #1e1e1e;" onclick="setBgColor('#1e1e1e')"></div>
                <div class="bg-btn" style="background: #ffffff;" onclick="setBgColor('#ffffff')"></div>
                <div class="bg-btn" style="background: #000000;" onclick="setBgColor('#000000')"></div>
                <div class="bg-btn" style="background: #f4eedb;" onclick="setBgColor('#f4eedb')"></div>
            </div>
        </div>

        <!-- Ряд 2: Палитра цветов для кисти -->
        <div class="colors">
            <div class="color-btn active" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
            <div class="color-btn" style="background: #ff4757;" onclick="setColor('#ff4757', this)"></div>
            <div class="color-btn" style="background: #2ed573;" onclick="setColor('#2ed573', this)"></div>
            <div class="color-btn" style="background: #1e90ff;" onclick="setColor('#1e90ff', this)"></div>
            <div class="color-btn" style="background: #ffa502;" onclick="setColor('#ffa502', this)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColor('#9b59b6', this)"></div>
            <div class="color-btn" style="background: #ff6b81;" onclick="setColor('#ff6b81', this)"></div>
            <div class="color-btn" style="background: #000000;" onclick="setColor('#000000', this)"></div>
        </div>

        <!-- Ряд 3: Кнопки очистки и отправки -->
        <div class="actions">
            <button class="action-btn clear" onclick="clearCanvas()">Очистить</button>
            <button class="action-btn" onclick="sendDrawing()">Отправить</button>
        </div>
    </div>

    <div id="preview">
        <div class="note">Так рисунок будет отправлен. Всё верно?</div>
        <img id="previewImg" alt="Предпросмотр">
        <div class="row">
            <button class="action-btn clear" id="previewBack">Назад</button>
            <button class="action-btn" id="previewOk">Отправить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let currentTool = 'pen'; // 'pen', 'eraser', 'fill'
        let currentColor = '#ffffff';
        let currentBgColor = '#1e1e1e';
        let currentLineWidth = 6;

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const displayWidth = canvas.clientWidth;
            const displayHeight = canvas.clientHeight;

            if (displayWidth === 0 || displayHeight === 0) return;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;

            ctx.scale(dpr, dpr);

            // Первоначальная заливка фона, если холст пустой
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, displayWidth, displayHeight);

            ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width / dpr, tempCanvas.height / dpr);

            updateContextStyles();
        }

        window.addEventListener('resize', resize);
        setTimeout(resize, 50);

        function updateContextStyles() {
            if (currentTool === 'eraser') {
                ctx.strokeStyle = currentBgColor;
                ctx.lineWidth = currentLineWidth * 2; // Ластик чуть толще
            } else {
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentLineWidth;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if (tool === 'pen') document.getElementById('btnPen').classList.add('active');
            if (tool === 'eraser') document.getElementById('btnEraser').classList.add('active');
            if (tool === 'fill') document.getElementById('btnFill').classList.add('active');
            updateContextStyles();
        }

        function setColor(color, element) {
            currentColor = color;
            setTool('pen'); // При выборе цвета автоматически переключаемся на кисть
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function setBgColor(color) {
            // Заменяем пиксели старого фона на новый (рисунок остаётся на месте)
            const oldRgb = hexToRgb(currentBgColor);
            const newRgb = hexToRgb(color);
            currentBgColor = color;

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                if (d[i] === oldRgb.r && d[i + 1] === oldRgb.g && d[i + 2] === oldRgb.b) {
                    d[i] = newRgb.r;
                    d[i + 1] = newRgb.g;
                    d[i + 2] = newRgb.b;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            updateContextStyles();
        }

        let painting = false;

        function startAction(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (currentTool === 'fill') {
                floodFill(Math.floor(x), Math.floor(y), currentColor);
                return;
            }

            painting = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting || currentTool === 'fill') return;
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Алгоритм заливки (Flood Fill)
        function floodFill(startX, startY, fillColor) {
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.width;
            const height = canvas.height;
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const fx = Math.floor(startX * dpr);
            const fy = Math.floor(startY * dpr);

            if (fx < 0 || fx >= width || fy < 0 || fy >= height) return;

            const targetIdx = (fy * width + fx) * 4;
            const startR = data[targetIdx];
            const startG = data[targetIdx + 1];
            const startB = data[targetIdx + 2];
            const startA = data[targetIdx + 3];

            const fillRgb = hexToRgb(fillColor);
            if (!fillRgb) return;

            if (startR === fillRgb.r && startG === fillRgb.g && startB === fillRgb.b && startA === 255) return;

            const queue = [[fx, fy]];
            const visited = new Uint8Array(width * height);

            while (queue.length > 0) {
                const [cx, cy] = queue.pop();
                const idx = (cy * width + cx) * 4;
                const vIdx = cy * width + cx;

                if (visited[vIdx]) continue;

                if (
                    data[idx] === startR &&
                    data[idx + 1] === startG &&
                    data[idx + 2] === startB &&
                    data[idx + 3] === startA
                ) {
                    visited[vIdx] = 1;
                    data[idx] = fillRgb.r;
                    data[idx + 1] = fillRgb.g;
                    data[idx + 2] = fillRgb.b;
                    data[idx + 3] = 255;

                    if (cx > 0) queue.push([cx - 1, cy]);
                    if (cx < width - 1) queue.push([cx + 1, cy]);
                    if (cy > 0) queue.push([cx, cy - 1]);
                    if (cy < height - 1) queue.push([cx, cy + 1]);
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.replace('#', ''), 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return { r, g, b };
        }

        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', startAction);
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw);

        function clearCanvas() {
            const displayWidth = canvas.clientWidth;
            const displayHeight = canvas.clientHeight;
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, displayWidth, displayHeight);
        }

        let sending = false;

        // Картинка не больше 1280 px по длинной стороне: меньше вес, быстрее отправка
        function exportImage(type, quality, maxSide) {
            const scale = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
            const out = document.createElement('canvas');
            out.width = Math.round(canvas.width * scale);
            out.height = Math.round(canvas.height * scale);
            out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
            return out.toDataURL(type, quality);
        }

        // ---- Экспорт JPEG с самопроверкой ----
        // На некоторых iPhone кодирование JPEG из canvas иногда портит нижнюю часть
        // (серая заливка). Поэтому каждый результат декодируется обратно и сверяется
        // с исходным холстом; при расхождении пробуем другой способ.
        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(fr.result);
                fr.onerror = () => reject(new Error('чтение картинки'));
                fr.readAsDataURL(blob);
            });
        }

        function canvasToBlob(c, type, quality) {
            return new Promise((resolve, reject) =>
                c.toBlob(b => b ? resolve(b) : reject(new Error('не удалось закодировать')), type, quality));
        }

        function scaledCanvas(maxSide, viaPixels) {
            const scale = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
            const out = document.createElement('canvas');
            out.width = Math.max(1, Math.round(canvas.width * scale));
            out.height = Math.max(1, Math.round(canvas.height * scale));
            const octx = out.getContext('2d');
            if (viaPixels && scale === 1) {
                // без drawImage: переносим пиксели напрямую
                octx.putImageData(ctx.getImageData(0, 0, canvas.width, canvas.height), 0, 0);
            } else {
                octx.fillStyle = currentBgColor;
                octx.fillRect(0, 0, out.width, out.height);
                octx.drawImage(canvas, 0, 0, out.width, out.height);
            }
            return out;
        }

        // Сравниваем точки декодированного JPEG с точками исходного холста
        async function imageMatchesCanvas(dataURL) {
            const img = new Image();
            img.src = dataURL;
            await img.decode();
            const chk = document.createElement('canvas');
            chk.width = img.naturalWidth; chk.height = img.naturalHeight;
            const cctx = chk.getContext('2d', { willReadFrequently: true });
            cctx.drawImage(img, 0, 0);
            let bad = 0, total = 0;
            for (const fy of [0.03, 0.12, 0.22, 0.32, 0.42, 0.52, 0.62, 0.72, 0.82, 0.92, 0.97]) {
                for (const fx of [0.04, 0.5, 0.96]) {
                    const a = cctx.getImageData(Math.floor(fx * (chk.width - 1)), Math.floor(fy * (chk.height - 1)), 1, 1).data;
                    const b = ctx.getImageData(Math.floor(fx * (canvas.width - 1)), Math.floor(fy * (canvas.height - 1)), 1, 1).data;
                    total++;
                    if (Math.abs(a[0] - b[0]) > 60 || Math.abs(a[1] - b[1]) > 60 || Math.abs(a[2] - b[2]) > 60) bad++;
                }
            }
            return bad <= 2;   // допускаем пару точек на линиях рисунка
        }

        async function exportVerifiedImage() {
            // PNG без потерь: Telegram сам перекодирует его при загрузке
            const strategies = [
                { note: 'png-full',   max: 1280, pixels: false },
                { note: 'png-pixels', max: 4096, pixels: true  },
                { note: 'png-small',  max: 800,  pixels: false },
                { note: 'png-tiny',   max: 480,  pixels: false },
            ];
            for (const s of strategies) {
                try {
                    const blob = await canvasToBlob(scaledCanvas(s.max, s.pixels), 'image/png');
                    if (blob.size > 3 * 1024 * 1024) continue;   // сервер принимает до 4 МБ
                    const dataURL = await blobToDataURL(blob);
                    if (await imageMatchesCanvas(dataURL)) return { image: dataURL, note: s.note };
                } catch (e) { /* пробуем следующий способ */ }
            }
            throw new Error('не удалось подготовить картинку на этом устройстве');
        }

        function showPreview(res) {
            return new Promise(resolve => {
                const box = document.getElementById('preview');
                document.getElementById('previewImg').src = res.image;
                box.style.display = 'flex';
                document.getElementById('previewOk').onclick = () => { box.style.display = 'none'; resolve(true); };
                document.getElementById('previewBack').onclick = () => { box.style.display = 'none'; resolve(false); };
            });
        }

        function sendDrawing() {
            if (sending) return;
            const user = tg.initDataUnsafe?.user;
            const userName = user?.first_name || user?.username || "Друг";

            // Холст открыт кнопкой из инлайн-режима: Telegram не передаёт данные
            // пользователя. Загружаем рисунок и возвращаемся в строку ввода чата,
            // где бот предложит готовый рисунок для отправки.
            if (!tg.initData) {
                sending = true;
                exportVerifiedImage().then(res => showPreview(res).then(ok => {
                    if (!ok) { sending = false; return null; }
                    return fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stash: true, image: res.image, note: res.note })
                    }).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));
                })).then(data => {
                      if (!data) return;
                      if (!data.token) throw new Error('нет метки');
                      tg.switchInlineQuery('draw ' + data.token);
                  })
                  .catch(err => {
                      sending = false;
                      alert('Не удалось отправить рисунок: ' + err.message);
                  });
                return;
            }

            // Обычный режим (/draw в личке с ботом): данные пользователя подписаны
            const chat = tg.initDataUnsafe?.chat;
            const chatId = chat?.id || user?.id;
            const inline = !!tg.initDataUnsafe?.query_id;
            // если есть query_id, Telegram принимает только JPEG
            const dataURL = inline ? exportImage('image/jpeg', 0.92, 1920) : canvas.toDataURL('image/png');

            sending = true;
            fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    name: userName,
                    image: dataURL,
                    init_data: tg.initData   // подпись Telegram: по ней бот проверяет, что это ты
                })
            }).then(response => {
                if (response.ok) {
                    tg.close();
                } else {
                    sending = false;
                    alert('Ошибка при отправке рисунка');
                }
            }).catch(err => {
                sending = false;
                alert('Ошибка сети: ' + err);
            });
        }
    </script>
</body>
</html>
